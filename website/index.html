              <li><strong>Peak-Hour Frequency:</strong> Trains run every <strong>3.5 to 5 minutes</strong> during morning peak (08:30 AM to 11:00 AM) and evening peak (05:00 PM to 08:30 PM).</li>
              <li><strong>Non-Peak Frequency:</strong> Trains run every <strong>7 to 10 minutes</strong> during afternoon and late-night periods.</li>
            </ul>

            <h3 style="font-size: 18px; font-weight: 600; color: #0f172a; margin-top: 14px;">1. Nadaprabhu Kempegowda Majestic (Purple and Green Lines)</h3>
            <p>Switching between Purple and Green lines takes approximately <strong>3 to 4 minutes</strong>:</p>
            <ul style="font-size: 14px; color: #475569; line-height: 1.8;">
              <li><strong>Purple to Green:</strong> Alight on Level 2 (Platforms 1 or 2). Follow green floor signage upstairs to Level 3 (Platforms 3 or 4).</li>
              <li><strong>Green to Purple:</strong> Alight on Level 3 and descend via central concourse escalators down to Level 2.</li>
            </ul>

            <h3 style="font-size: 18px; font-weight: 600; color: #0f172a; margin-top: 14px;">2. Jayadeva Hospital Interchange (Yellow and Pink Lines)</h3>
            <p>Bengaluru's premier double-decker elevated interchange station:</p>
            <ul style="font-size: 14px; color: #475569; line-height: 1.8;">
              <li><strong>Yellow Line:</strong> Operates on Level 1 (Platforms 3 and 4) linking RV Road to Bommasandra / Electronic City.</li>
              <li><strong>Pink Line:</strong> Operates on Level 2 (Platforms 1 and 2) linking Kalena Agrahara to Tavarekere.</li>
              <li><strong>Transfer Protocol:</strong> High-capacity central escalators and elevators enable platform-to-platform transfer in under <strong>3 minutes</strong> without exiting the fare gates.</li>

            <h3 style="font-size: 17px; font-weight: 600; color: #0f172a; margin-top: 14px;">How can I travel on Namma Metro without mobile internet?</h3>
