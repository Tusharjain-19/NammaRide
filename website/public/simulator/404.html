<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Out of Track | NammaRide Mobile App</title>
    <meta name="description" content="Requested route or screen not found on NammaRide Mobile App.">
    <link rel="icon" type="image/png" href="assets/images/logo_app.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/libs/lucide.min.js" defer></script>
    <script src="js/libs/tailwind.min.js" defer></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #0B0F17;
            color: #F3F4F6;
        }
    </style>
</head>
<body class="bg-[#0B0F17] text-white min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full bg-[#141A26] backdrop-blur-2xl p-6 sm:p-8 rounded-[32px] border border-white/10 text-center space-y-6 shadow-2xl relative overflow-hidden">
        
        <!-- Glow accents -->
        <div class="absolute -top-16 -left-16 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-40 h-40 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative w-28 h-28 mx-auto flex items-center justify-center">
            <div class="w-24 h-24 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <img src="assets/images/logo_app.png" alt="NammaRide" class="w-12 h-12 object-contain">
            </div>
            <span class="absolute top-0 right-0 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-purple-500 to-emerald-500 text-white font-extrabold text-[10px] font-mono shadow-md">
                404
            </span>
        </div>

        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[10px] font-bold uppercase tracking-wider border border-emerald-500/20">
                Signal Lost • Out of Track
            </span>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">
                Screen Not Found
            </h1>
            <p class="text-slate-400 text-xs leading-relaxed max-w-xs mx-auto">
                The requested app feature, station route, or page does not exist or has moved.
            </p>
        </div>

        <div class="flex flex-col gap-2.5 pt-2">
            <a href="./index.html" class="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition-all text-xs flex items-center justify-center gap-2 border border-emerald-400/30">
                <span>Return to Trip Planner</span>
            </a>
            <a href="./index.html?view=stations" class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 text-slate-300 font-bold rounded-xl transition-all text-xs border border-white/10 flex items-center justify-center gap-1.5">
                <span>Browse All Metro Stations</span>
            </a>
        </div>

        <p class="text-[9px] text-slate-500 font-mono tracking-widest uppercase">
            NammaRide Mobile App Guide
        </p>

    </div>
</body>
</html>
