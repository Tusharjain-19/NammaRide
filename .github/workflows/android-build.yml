name: Build Android App

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        run: cd android && ./gradlew assembleDebug

      - name: Build AAB (Release)
        run: cd android && ./gradlew bundleRelease

      - name: Copy generated files to release folder
        run: |
          mkdir -p mobile/release
          cp android/app/build/outputs/apk/debug/app-debug.apk mobile/release/NammaRide.apk
          cp android/app/build/outputs/bundle/release/app-release.aab mobile/release/NammaRide.aab

      - name: Commit and Push binaries to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/release/NammaRide.apk
          git add mobile/release/NammaRide.aab
          git commit -m "Automated build: Add latest APK and AAB [skip ci]" || echo "No changes to commit"
          git push origin main
